; Cardputer firmware — device build + host (native) unit tests.

[env]
build_flags = -std=gnu++17

[env:device]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
  ; Cardputer / StampS3 (ESP32-S3FN8) has NO PSRAM — do not enable BOARD_HAS_PSRAM.
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  m5stack/M5Cardputer@^1.0.3
  bblanchon/ArduinoJson@^7.0.0
board_build.embed_files = data/cert/x509_crt_bundle.bin
; No on-device unit tests in Plan A.
test_ignore = *

[env:native]
platform = native
build_flags =
  -std=gnu++17
; Do not compile src/ (it is Arduino-only) when running host tests.
build_src_filter = -<*>
lib_deps =
  bblanchon/ArduinoJson@^7.0.0

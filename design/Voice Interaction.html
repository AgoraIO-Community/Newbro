<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice interaction — Newbro</title>

  <!-- design tokens (typography, colors, motion) -->
  <link rel="stylesheet" href="tokens.css" />

  <!-- per-variant styles -->
  <link rel="stylesheet" href="variant-stage.css" />
  <link rel="stylesheet" href="variant-walkie.css" />
  <link rel="stylesheet" href="variant-document.css" />
  <link rel="stylesheet" href="variants-mobile.css" />
  <link rel="stylesheet" href="variants-onboarding.css" />
  <link rel="stylesheet" href="bro-characters.css" />
  <link rel="stylesheet" href="variants-channel-mobile.css" />
  <link rel="stylesheet" href="variants-desktop.css" />

  <style>
    /* host page reset */
    html, body, #app { margin: 0; padding: 0; height: 100%; }
    body {
      background: #f0eee9; /* matches the design canvas paper */
      font-family: var(--nb-font-sans);
      overflow: hidden;
    }
    /* Force selection to stay coral inside artboards too */
    ::selection { background: #ff6a3d; color: white; }
    /* Tab/text-rendering polish */
    body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    /* kbd default look so inline kbd in tweaks doesn't look out of place */
    kbd { font-family: var(--nb-font-mono); }
  </style>

  <!-- React + Babel (pinned + integrity) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app"></div>

  <!-- Component scripts (Babel) — order matters: shared first, app last -->
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="voice-state.jsx"></script>
  <script type="text/babel" src="variant-stage.jsx"></script>
  <script type="text/babel" src="variant-walkie.jsx"></script>
  <script type="text/babel" src="variant-document.jsx"></script>
  <script type="text/babel" src="variants-mobile.jsx"></script>
  <script type="text/babel" src="variants-onboarding.jsx"></script>
  <script type="text/babel" src="bro-characters.jsx"></script>
  <script type="text/babel" src="variants-channel-mobile.jsx"></script>
  <script type="text/babel" src="variants-desktop.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>

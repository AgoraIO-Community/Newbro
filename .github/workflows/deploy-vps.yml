name: Deploy Newbro VPS

on:
  workflow_dispatch:
    inputs:
      create_invite:
        description: "Create an invite after a successful deploy"
        required: false
        default: false
        type: boolean
      invite_code:
        description: "Optional invite code. Leave blank to generate one."
        required: false
        default: ""
        type: string
      invite_email:
        description: "Optional email label for the invite."
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-vps.yml"
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "pyproject.toml"
      - "install.sh"
      - "newbro"
      - "package*.json"

permissions:
  contents: read
  packages: write

concurrency:
  group: newbro-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/agoraio-community/newbro
      DEPLOY_HOST: ${{ secrets.NEWBRO_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.NEWBRO_DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.NEWBRO_DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.NEWBRO_DEPLOY_SSH_KEY }}
      DEPLOY_PORT: ${{ secrets.NEWBRO_DEPLOY_PORT || '22' }}
      PUBLIC_BASE_URL: ${{ secrets.NEWBRO_PUBLIC_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate deploy config
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$PUBLIC_BASE_URL"
          case "$PUBLIC_BASE_URL" in
            https://*) ;;
            *)
              echo "NEWBRO_PUBLIC_BASE_URL must be an https:// URL"
              exit 1
              ;;
          esac

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'

      - name: Run backend tests
        run: .venv/bin/python -m pytest

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main

      - name: Configure SSH
        run: |
          set -euxo pipefail
          install -m 700 -d ~/.ssh
          test -n "$DEPLOY_SSH_KEY"
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/newbro_deploy
          chmod 600 ~/.ssh/newbro_deploy
          ssh-keyscan -v -T 20 -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/newbro_deploy -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "echo ssh-ok"

      - name: Deploy container on VPS
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euxo pipefail
          ssh -i ~/.ssh/newbro_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          ssh -i ~/.ssh/newbro_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" '
            set -euxo pipefail
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then
              SUDO="sudo"
            fi
            if ! command -v docker >/dev/null 2>&1; then
              $SUDO apt-get update
              DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y ca-certificates curl docker.io
            fi
            if ! docker compose version >/dev/null 2>&1; then
              $SUDO apt-get update
              DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y ca-certificates curl
              DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y docker-compose-v2 || \
                DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y docker-compose-plugin || true
            fi
            if ! docker compose version >/dev/null 2>&1; then
              ARCH="$(uname -m)"
              case "$ARCH" in
                x86_64|amd64) COMPOSE_ARCH="x86_64" ;;
                aarch64|arm64) COMPOSE_ARCH="aarch64" ;;
                *) echo "Unsupported Docker Compose architecture: $ARCH" >&2; exit 1 ;;
              esac
              $SUDO mkdir -p /usr/local/lib/docker/cli-plugins
              $SUDO curl -fsSL \
                "https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-$COMPOSE_ARCH" \
                -o /usr/local/lib/docker/cli-plugins/docker-compose
              $SUDO chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            fi
            $SUDO systemctl enable --now docker || true
            docker --version
            docker compose version
            $SUDO mkdir -p /root/.newbro
          '
          ssh -i ~/.ssh/newbro_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$DEPLOY_PATH/docker-compose.yml'" <<EOF
          services:
            newbro:
              image: $IMAGE_REF
              restart: unless-stopped
              ports:
                - "8000:8000"
              env_file:
                - /root/.newbro/.env
              environment:
                HOME: /root
                SYNAPSE_PUBLIC_COOKIE_SECURE: "true"
              volumes:
                - /root/.newbro:/root/.newbro
              healthcheck:
                test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 20s
          EOF
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/newbro_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh -i ~/.ssh/newbro_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && docker compose pull && docker compose up -d && docker compose ps"

      - name: Verify public health
        run: curl --fail --show-error --silent "$PUBLIC_BASE_URL/api/health"

      - name: Create invite
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_invite }}
        env:
          INVITE_CODE: ${{ inputs.invite_code }}
          INVITE_EMAIL: ${{ inputs.invite_email }}
        run: |
          set -euo pipefail
          remote_script='
            set -euo pipefail
            cd "$1"
            shift
            docker compose exec -T newbro newbro invite create "$@"
          '
          args=()
          if [ -n "$INVITE_CODE" ]; then
            args+=("$INVITE_CODE")
          fi
          if [ -n "$INVITE_EMAIL" ]; then
            args+=("--email" "$INVITE_EMAIL")
          fi
          output="$(
            ssh -i ~/.ssh/newbro_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "bash -s -- '$DEPLOY_PATH' ${args[*]@Q}" <<< "$remote_script"
          )"
          printf '%s\n' "$output"
          {
            echo "## Newbro Invite"
            echo
            echo '```text'
            printf '%s\n' "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show container logs on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/newbro_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose logs --tail=200 newbro || true"
